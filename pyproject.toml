[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serum-render"
version = "0.4.0"
description = "Batch-render Serum 1 (.fxp) and Serum 2 (.SerumPreset) presets to audio files via DawDreamer."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
keywords = ["serum", "serum2", "vst", "preset", "render", "audio", "dawdreamer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Environment :: Console",
]
dependencies = [
    "dawdreamer",
    "soundfile",
    "typer",
    "rich",
    "loky",
    # loky recycles memory-bloated workers only when psutil is importable
    "psutil",
    "mido",
    "numpy",
    "serum2-preset-loader>=0.1.3",
]

[project.urls]
Homepage = "https://github.com/wiillownet/serum-render"
Repository = "https://github.com/wiillownet/serum-render"
Issues = "https://github.com/wiillownet/serum-render/issues"

[project.scripts]
serum-render = "serum_render.cli:app"

[project.optional-dependencies]
dev = ["pytest"]

# hatchling reads only the project's own .gitignore, not the machine-wide
# excludes file, so the sdist lists what it ships instead of what it hides.
[tool.hatch.build.targets.sdist]
only-include = [
    "serum_render", "tests", "docs", "scripts", ".github",
    ".gitignore", "README.md", "LICENSE", "KNOWN_ISSUES.md", "pyproject.toml",
]

[tool.pytest.ini_options]
markers = ["slow: integration tests that require a plugin to be installed"]
